stages:
  - lint
  - test
  - build

variables:
  GO_VERSION: "1.24"
  GOTOOLCHAIN: "local"
  CGO_ENABLED: "0"

default:
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  interruptible: true
  before_script:
    - mkdir -p .cache/gomod .cache/gobuild
    - export GOMODCACHE="$CI_PROJECT_DIR/.cache/gomod"
    - export GOCACHE="$CI_PROJECT_DIR/.cache/gobuild"
    - go version

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/gomod/
    - .cache/gobuild/

fmt:
  stage: lint
  script:
    - test -z "$(gofmt -l $(git ls-files '*.go'))"

vet:
  stage: lint
  script:
    - go vet ./...

test:
  stage: test
  script:
    - go test ./... -count=1

build:
  stage: build
  script:
    - mkdir -p bin
    - go build -o bin/prophet ./cmd/prophet
    - ./bin/prophet --help >/dev/null
  artifacts:
    paths:
      - bin/prophet
    expire_in: 1 week
